<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Space Survival</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #1a1a1a;
            font-family: 'VT323', monospace;
            overflow: hidden;
            touch-action: none; /* Disable double-tap zoom */
        }

        #game-container {
            position: relative;
            border: 4px solid #444;
            background-color: #000;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.2);
            
            /* Responsive Sizing */
            width: 95vw;
            max-width: 800px;
            aspect-ratio: 2 / 1; 
            height: auto;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
            z-index: 10;
        }

        .hidden { display: none !important; }

        /* Responsive Text Sizes */
        h1 { 
            font-size: 5vw; 
            margin: 0 0 20px 0; 
            color: #00d2d3; 
            text-shadow: 4px 4px 0 #333; 
            letter-spacing: 5px;
        }
        @media (min-width: 800px) { h1 { font-size: 60px; } }
        
        p { font-size: 2.5vw; color: #ccc; margin-bottom: 30px; }
        @media (min-width: 800px) { p { font-size: 24px; } }

        .btn {
            pointer-events: auto;
            background: #00d2d3;
            border: 2px solid white;
            color: #000;
            padding: 15px 30px;
            font-family: 'VT323', monospace;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .btn:hover { background-color: #00a8a9; color: white; }
        .btn:active { transform: scale(0.95); }

        #report-box {
            background: rgba(0, 0, 0, 0.9);
            color: #00d2d3;
            border: 2px solid #00d2d3;
            padding: 20px;
            max-width: 80%;
            box-shadow: 0 0 20px rgba(0, 210, 211, 0.3);
        }

        /* Mobile Controls (D-Pad) */
        #mobile-controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            z-index: 20;
            display: none; /* Hidden on desktop by default, shown via JS/Media Query */
            flex-direction: column;
            align-items: center;
            gap: 10px;
            pointer-events: auto;
            opacity: 0.7;
        }

        .control-row {
            display: flex;
            gap: 10px;
        }

        .d-btn {
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            color: white;
            font-size: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            touch-action: none;
            cursor: pointer;
        }
        
        .d-btn:active {
            background: rgba(0, 210, 211, 0.6);
            transform: scale(0.95);
        }

        /* Show controls on touch devices or small screens */
        @media (hover: none) and (pointer: coarse), (max-width: 768px) {
            #mobile-controls {
                display: flex;
            }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- Internal resolution fixed at 800x400 for logic, CSS handles display size -->
        <canvas id="gameCanvas" width="800" height="400"></canvas>
        
        <div id="ui-layer">
            <!-- Start Screen -->
            <div id="start-screen">
                <h1>SPACE SURVIVAL</h1>
                <p>PC: ARROW KEYS / MOBILE: TOUCH PAD</p>
                <button class="btn" onclick="startGame()">LAUNCH</button>
            </div>
            
            <!-- Game Over Screen -->
            <div id="game-over-screen" class="hidden">
                <h1 style="color: #ff4757;">CRITICAL FAILURE</h1>
                <p>COLLISION DETECTED</p>
                <button class="btn" onclick="startGame()">RETRY MISSION</button>
            </div>

            <!-- Clear Screen -->
            <div id="clear-screen" class="hidden">
                <div id="report-box">
                    <h2 style="margin-top:0;">MISSION ACCOMPLISHED</h2>
                    <p style="font-size: 16px; color: #fff; line-height: 1.6;">
                        Orbit stabilized.<br>
                        System integrity: 100%<br><br>
                        Waiting for next command...
                    </p>
                    <button class="btn" style="font-size:18px; padding:10px 20px;" onclick="location.reload()">RETURN</button>
                </div>
            </div>
        </div>

        <!-- Mobile Controls Overlay -->
        <div id="mobile-controls">
            <div class="control-row">
                <div class="d-btn" id="btn-up">▲</div>
            </div>
            <div class="control-row">
                <div class="d-btn" id="btn-left">◀</div>
                <div class="d-btn" style="visibility: hidden;"></div> <!-- Spacer -->
                <div class="d-btn" id="btn-right">▶</div>
            </div>
            <div class="control-row">
                <div class="d-btn" id="btn-down">▼</div>
            </div>
        </div>
    </div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    // ==========================================
    // 1. Sprite Data
    // ==========================================
    
    const playerSprite = [
        "0000003333330000",
        "0000331111113300",
        "0003111111111130",
        "0031111111111113",
        "0311111111111113",
        "0311331111331113", 
        "3111331111331113",
        "3111111221111113", 
        "3115111221115113", 
        "3111111111111113",
        "0311111111111130",
        "0321111111111230",
        "0032211111122300",
        "0003322222233000",
        "0000033333300000",
        "0000000000000000"
    ];

    const meteorSprite = [
        "000033330000",
        "003311113300",
        "031112211130",
        "311222221113",
        "312211112213",
        "312112211213",
        "311222221113",
        "311111111113",
        "031112211130",
        "003311113300",
        "000033330000"
    ];

    const debrisSprite = [
        "000000330000",
        "000003113000",
        "000031111300",
        "000322222230",
        "003222222223",
        "0311112211113",
        "31111122111113",
        "0311112211113",
        "003222222223",
        "000322222230",
        "000031111300",
        "000003113000"
    ];

    const rockSprite = [
        "003330",
        "031113",
        "312213",
        "311123",
        "033330"
    ];

    // ==========================================
    // 2. Game Variables
    // ==========================================
    let animationId;
    let isGaming = false;
    let score = 0;
    let gameSpeed = 5;
    let spawnRate = 60; 
    let frames = 0;

    const keys = { 
        ArrowUp: false, 
        ArrowDown: false, 
        ArrowLeft: false, 
        ArrowRight: false 
    };
    
    const CLEAR_SCORE = 3000; 

    // ==========================================
    // 3. Classes
    // ==========================================

    function drawSprite(ctx, sprite, x, y, size, colorMap) {
        for (let r = 0; r < sprite.length; r++) {
            for (let c = 0; c < sprite[r].length; c++) {
                const pixel = sprite[r][c];
                if (pixel !== '0' && colorMap[pixel]) {
                    ctx.fillStyle = colorMap[pixel];
                    ctx.fillRect(x + c * size, y + r * size, size, size);
                }
            }
        }
    }

    class Player {
        constructor() {
            this.pixelSize = 3; 
            this.w = 16 * this.pixelSize;
            this.h = 16 * this.pixelSize;
            this.x = 50;
            this.y = 200;
            this.speedX = 6;
            this.speedY = 6;
            
            this.colorMap = {
                '1': '#ffb6c1', 
                '2': '#ff69b4', 
                '3': '#5d4037', 
                '4': '#ffffff', 
                '5': '#ff4757'  
            };
        }

        update() {
            if (keys.ArrowUp) this.y -= this.speedY;
            if (keys.ArrowDown) this.y += this.speedY;
            if (keys.ArrowLeft) this.x -= this.speedX;
            if (keys.ArrowRight) this.x += this.speedX;

            if (this.y < 0) this.y = 0;
            if (this.y + this.h > canvas.height) this.y = canvas.height - this.h;
            if (this.x < 0) this.x = 0;
            if (this.x + this.w > canvas.width) this.x = canvas.width - this.w;

            this.draw();
        }

        draw() {
            ctx.fillStyle = `rgba(0, 255, 255, ${Math.random()})`;
            ctx.fillRect(this.x - 10, this.y + this.h/2 - 2, 10, 4);
            drawSprite(ctx, playerSprite, this.x, this.y, this.pixelSize, this.colorMap);
        }
    }

    class Obstacle {
        constructor() {
            this.x = canvas.width;
            this.size = 3 + Math.random() * 2; 
            this.markedForDeletion = false;
            
            const type = Math.random();
            
            if (type < 0.5) {
                this.sprite = meteorSprite;
                this.colorMap = { '1': '#95a5a6', '2': '#7f8c8d', '3': '#2c3e50' };
                this.w = 12 * this.size;
                this.h = 11 * this.size;
            } else if (type < 0.8) {
                this.sprite = debrisSprite;
                this.colorMap = { '1': '#3498db', '2': '#bdc3c7', '3': '#2c3e50' };
                this.w = 12 * this.size;
                this.h = 12 * this.size;
            } else {
                this.sprite = rockSprite;
                this.colorMap = { '1': '#e67e22', '2': '#d35400', '3': '#8e44ad' };
                this.w = 6 * this.size;
                this.h = 5 * this.size;
            }

            this.y = Math.random() * (canvas.height - this.h);
            this.speedOffset = Math.random() * 3; 
        }

        update() {
            this.x -= (gameSpeed + this.speedOffset);
            if (this.x + this.w < 0) this.markedForDeletion = true;
            this.draw();
        }

        draw() {
            drawSprite(ctx, this.sprite, this.x, this.y, this.size, this.colorMap);
        }
    }

    class Star {
        constructor() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            this.size = Math.random() * 2;
            this.speed = Math.random() * 0.5 + 0.1;
        }
        update() {
            this.x -= this.speed * (gameSpeed * 0.2); 
            if (this.x < 0) {
                this.x = canvas.width;
                this.y = Math.random() * canvas.height;
            }
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.fillRect(this.x, this.y, this.size, this.size);
        }
    }

    // ==========================================
    // 4. Main Game Logic
    // ==========================================
    
    let player;
    let obstacles = [];
    let stars = [];

    function init() {
        player = new Player();
        obstacles = [];
        score = 0;
        frames = 0;
        gameSpeed = 6; 
        spawnRate = 50; 
        
        stars = [];
        for(let i=0; i<80; i++) stars.push(new Star());
    }

    function startGame() {
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('game-over-screen').classList.add('hidden');
        document.getElementById('clear-screen').classList.add('hidden');
        isGaming = true;
        init();
        animate();
    }

    function animate() {
        if (!isGaming) return;
        
        animationId = requestAnimationFrame(animate);
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        stars.forEach(star => star.update());

        frames++;
        
        if (score > 0 && score % 200 === 0 && frames % 10 === 0) {
            gameSpeed += 0.8; 
            spawnRate = Math.max(15, spawnRate - 2); 
        }

        if (frames % spawnRate === 0) {
            obstacles.push(new Obstacle());
            frames += Math.floor(Math.random() * 10) - 5; 
        }

        obstacles.forEach((o, index) => {
            o.update();
            
            const pBox = { x: player.x + 8, y: player.y + 8, w: player.w - 16, h: player.h - 16 };
            const oBox = { x: o.x + 4, y: o.y + 4, w: o.w - 8, h: o.h - 8 };

            if (pBox.x < oBox.x + oBox.w && pBox.x + pBox.w > oBox.x &&
                pBox.y < oBox.y + oBox.h && pBox.y + pBox.h > oBox.y) {
                gameOver();
            }

            if (o.markedForDeletion) {
                obstacles.splice(index, 1);
                score += 10;
            }
        });

        player.update();

        ctx.fillStyle = '#00d2d3';
        ctx.font = '24px VT323';
        ctx.fillText(`SCORE: ${score}`, 20, 40);
        
        ctx.fillStyle = '#ff6b6b';
        ctx.font = '20px VT323';
        ctx.fillText(`VELOCITY: ${(gameSpeed * 10).toFixed(0)} km/s`, 20, 70);

        if (score >= CLEAR_SCORE) {
            gameClear();
        }
    }

    function gameOver() {
        isGaming = false;
        cancelAnimationFrame(animationId);
        document.getElementById('game-over-screen').classList.remove('hidden');
    }

    function gameClear() {
        isGaming = false;
        cancelAnimationFrame(animationId);
        document.getElementById('clear-screen').classList.remove('hidden');
    }

    // ==========================================
    // 5. Input Handling (Keyboard & Touch)
    // ==========================================

    // Keyboard
    window.addEventListener('keydown', e => {
        if (keys.hasOwnProperty(e.code)) {
            keys[e.code] = true;
            e.preventDefault();
        }
    });

    window.addEventListener('keyup', e => {
        if (keys.hasOwnProperty(e.code)) {
            keys[e.code] = false;
        }
    });

    // Mobile Touch Controls Function
    function bindTouch(elementId, keyCode) {
        const btn = document.getElementById(elementId);
        
        // Touch Start
        btn.addEventListener('touchstart', (e) => {
            e.preventDefault(); // Prevent default behavior (scroll/zoom)
            keys[keyCode] = true;
            btn.style.backgroundColor = 'rgba(0, 210, 211, 0.6)';
        }, { passive: false });

        // Touch End
        btn.addEventListener('touchend', (e) => {
            e.preventDefault();
            keys[keyCode] = false;
            btn.style.backgroundColor = 'rgba(255, 255, 255, 0.2)';
        }, { passive: false });

        // Mouse Events (for testing on PC with mouse)
        btn.addEventListener('mousedown', (e) => {
            e.preventDefault();
            keys[keyCode] = true;
            btn.style.backgroundColor = 'rgba(0, 210, 211, 0.6)';
        });
        btn.addEventListener('mouseup', (e) => {
            e.preventDefault();
            keys[keyCode] = false;
            btn.style.backgroundColor = 'rgba(255, 255, 255, 0.2)';
        });
        btn.addEventListener('mouseleave', (e) => {
            keys[keyCode] = false;
            btn.style.backgroundColor = 'rgba(255, 255, 255, 0.2)';
        });
    }

    bindTouch('btn-up', 'ArrowUp');
    bindTouch('btn-down', 'ArrowDown');
    bindTouch('btn-left', 'ArrowLeft');
    bindTouch('btn-right', 'ArrowRight');

</script>
</body>
</html>
