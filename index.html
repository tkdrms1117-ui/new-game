<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Run</title>
    <style>
        /* 폰트 로드 (구글 웹폰트) */
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f7f7f7;
            font-family: 'VT323', monospace;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            border: 2px solid #333;
            background-color: #fff;
            box-shadow: 5px 5px 0px rgba(0,0,0,0.2);
        }

        canvas {
            display: block;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* 클릭은 캔버스로 통과 */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .hidden { display: none !important; }

        h1 { font-size: 40px; margin: 0 0 10px 0; color: #ff6b6b; text-shadow: 2px 2px 0 #333; }
        p { font-size: 20px; color: #555; }
        
        button {
            pointer-events: auto;
            background: #ff6b6b;
            border: 2px solid #333;
            color: white;
            padding: 10px 20px;
            font-family: 'VT323', monospace;
            font-size: 20px;
            cursor: pointer;
            box-shadow: 3px 3px 0 #333;
        }
        button:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0 #333;
        }

        /* 편지 스타일 */
        #letter-box {
            background: white;
            border: 2px solid #333;
            padding: 20px;
            max-width: 80%;
            box-shadow: 5px 5px 0 rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="300"></canvas>
        
        <div id="ui-layer">
            <div id="start-screen">
                <h1>LOVE RUN</h1>
                <p>스페이스바를 눌러 점프하세요</p>
                <button onclick="startGame()">게임 시작</button>
            </div>
            
            <div id="game-over-screen" class="hidden">
                <h1>GAME OVER</h1>
                <p>사랑에는 끈기가 필요한 법!</p>
                <button onclick="resetGame()">다시 도전</button>
            </div>

            <div id="clear-screen" class="hidden">
                <div id="letter-box">
                    <h1>축하해! ❤️</h1>
                    <p>
                        (이곳에 편지 내용을 적어주세요)<br>
                        장애물을 피하느라 고생했어.<br>
                        앞으로도 우리 앞에 놓인 장애물들을<br>
                        이렇게 가볍게 뛰어넘으며 함께하자.<br>
                        사랑해!
                    </p>
                </div>
            </div>
        </div>
    </div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    // 게임 상태 변수
    let frames = 0;
    let score = 0;
    let gameSpeed = 4;
    let isGaming = false;
    let animationId;
    const GRAVITY = 0.6;
    const CLEAR_SCORE = 1000; // 이 점수가 되면 클리어 (편지 나옴)

    // ==========================================
    // 1. 도트(픽셀) 데이터 정의 (0:투명, 1:색칠)
    // ==========================================
    
    // 분홍 곰 (16x16)
    const bearSprite = [
        "0000110000110000",
        "0001111001111000",
        "0011111111111100",
        "0111111111111110",
        "0110111111110110", // 눈 부분 (0으로 구멍 뚫음)
        "1111111001111111", // 코 부분
        "1111111111111111",
        "1111100000011111", // 입
        "1111111111111111",
        "0111111111111110",
        "0011111111111100",
        "0001111111111000",
        "0001100000011000", // 다리 시작
        "0001100000011000",
        "0011100000111000",
        "0011000000110000"
    ];

    // 장애물 (선인장 대신 하트 깨진 모양 등 - 여기선 심플한 벽돌/장애물)
    const obstacleSprite = [
        "0001111000",
        "0011111100",
        "0111001110",
        "0110000110",
        "1111111111",
        "1101111011",
        "1101111011",
        "1111111111"
    ];

    // 구름
    const cloudSprite = [
        "000001111000000",
        "000111111110000",
        "011111111111100",
        "111111111111110",
        "011111111111110",
        "000111111110000"
    ];

    // ==========================================
    // 2. 도트 그리기 함수 (핵심)
    // ==========================================
    function drawPixelArt(ctx, spriteMap, startX, startY, pixelSize, color) {
        ctx.fillStyle = color;
        for (let row = 0; row < spriteMap.length; row++) {
            const line = spriteMap[row];
            for (let col = 0; col < line.length; col++) {
                if (line[col] === '1') {
                    ctx.fillRect(startX + col * pixelSize, startY + row * pixelSize, pixelSize, pixelSize);
                }
            }
        }
    }

    // ==========================================
    // 3. 게임 객체 클래스
    // ==========================================

    class Player {
        constructor() {
            this.width = 48;  // 16칸 * 3px
            this.height = 48; // 16칸 * 3px
            this.x = 50;
            this.y = 200;
            this.dy = 0;
            this.jumpPower = -12;
            this.originalY = 200;
            this.grounded = true;
            this.color = '#ff9ff3'; // 곰 색상 (분홍)
        }

        draw() {
            // 점프 중일 땐 조금 위로, 다리를 움직이는 효과는 생략하고 심플하게
            drawPixelArt(ctx, bearSprite, this.x, this.y, 3, this.color);
        }

        update() {
            // 점프 로직
            if (this.y < this.originalY) {
                this.dy += GRAVITY;
                this.grounded = false;
            } else {
                this.dy = 0;
                this.y = this.originalY;
                this.grounded = true;
            }
            this.y += this.dy;
            this.draw();
        }

        jump() {
            if (this.grounded) {
                this.dy = this.jumpPower;
            }
        }
    }

    class Obstacle {
        constructor() {
            this.w = 30;
            this.h = 40; // 8칸 * 5px
            this.x = canvas.width;
            this.y = 210; // 바닥 위치에 맞춤
            this.color = '#54a0ff'; // 장애물 색상 (파랑)
        }

        draw() {
            drawPixelArt(ctx, obstacleSprite, this.x, this.y, 4, this.color);
        }

        update() {
            this.x -= gameSpeed;
            this.draw();
        }
    }

    class Cloud {
        constructor() {
            this.x = canvas.width + Math.random() * 200;
            this.y = Math.random() * 100;
            this.speed = Math.random() * 1 + 0.5;
        }
        draw() {
            drawPixelArt(ctx, cloudSprite, this.x, this.y, 4, '#dfe4ea');
        }
        update() {
            this.x -= this.speed;
            if (this.x < -100) this.x = canvas.width;
            this.draw();
        }
    }

    // ==========================================
    // 4. 게임 루프 및 제어
    // ==========================================
    
    let player;
    let obstacles = [];
    let clouds = [];
    
    function init() {
        player = new Player();
        obstacles = [];
        clouds = [];
        score = 0;
        frames = 0;
        gameSpeed = 4;
        
        // 구름 몇 개 생성
        for(let i=0; i<3; i++) clouds.push(new Cloud());
    }

    function startGame() {
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('game-over-screen').classList.add('hidden');
        document.getElementById('clear-screen').classList.add('hidden');
        isGaming = true;
        init();
        animate();
    }

    function resetGame() {
        startGame();
    }

    function animate() {
        if (!isGaming) return;
        
        animationId = requestAnimationFrame(animate);
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 배경(구름)
        clouds.forEach(c => c.update());

        // 바닥 선
        ctx.beginPath();
        ctx.moveTo(0, 248);
        ctx.lineTo(canvas.width, 248);
        ctx.strokeStyle = '#333';
        ctx.lineWidth = 2;
        ctx.stroke();

        // 플레이어
        player.update();

        // 장애물 관리
        if (frames % 120 === 0) { // 장애물 생성 주기
            obstacles.push(new Obstacle());
            gameSpeed += 0.1; // 점점 빨라짐
        }

        for (let i = 0; i < obstacles.length; i++) {
            let o = obstacles[i];
            o.update();

            // 충돌 체크 (단순 사각형 충돌)
            if (player.x < o.x + o.w &&
                player.x + player.width > o.x &&
                player.y < o.y + o.h &&
                player.y + player.height > o.y) {
                
                gameOver();
            }

            // 화면 밖으로 나가면 제거
            if (o.x + o.w < 0) {
                obstacles.splice(i, 1);
                i--;
                score += 10;
            }
        }

        // 점수 표시
        ctx.fillStyle = '#333';
        ctx.font = '20px VT323';
        ctx.fillText("SCORE: " + score, 20, 30);

        // 클리어 조건 (예: 점수 1000점)
        if (score >= CLEAR_SCORE) {
            gameClear();
        }

        frames++;
    }

    function gameOver() {
        isGaming = false;
        cancelAnimationFrame(animationId);
        document.getElementById('game-over-screen').classList.remove('hidden');
    }

    function gameClear() {
        isGaming = false;
        cancelAnimationFrame(animationId);
        document.getElementById('clear-screen').classList.remove('hidden');
    }

    // 키보드 이벤트
    window.addEventListener('keydown', function(e) {
        if (e.code === 'Space') {
            if (isGaming) {
                player.jump();
            } else if (!document.getElementById('start-screen').classList.contains('hidden')) {
                // 시작 화면일 때 스페이스 누르면 시작
                startGame();
            }
        }
    });

    // 모바일 터치 이벤트
    window.addEventListener('touchstart', function(e) {
        if (isGaming) {
            player.jump();
        }
    });

</script>
</body>
</html>
