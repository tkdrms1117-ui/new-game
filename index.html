<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Flight</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #222;
            font-family: 'VT323', monospace;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            border: 4px solid #fff;
            background-color: #000;
            box-shadow: 0 0 20px rgba(255, 105, 180, 0.5);
            width: 800px;
            height: 400px;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
        }

        .hidden { display: none !important; }

        h1 { 
            font-size: 50px; 
            margin: 0 0 20px 0; 
            color: #ff69b4; 
            text-shadow: 4px 4px 0 #333; 
            letter-spacing: 5px;
        }
        
        p { font-size: 24px; color: #ddd; margin-bottom: 30px; }

        .btn {
            pointer-events: auto;
            background: #ff69b4;
            border: 2px solid white;
            color: white;
            padding: 15px 30px;
            font-family: 'VT323', monospace;
            font-size: 24px;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .btn:hover { background-color: #ff1493; }
        .btn:active { transform: scale(0.95); }

        #letter-box {
            background: rgba(255, 255, 255, 0.95);
            color: #333;
            border: 4px solid #ff69b4;
            padding: 30px;
            max-width: 80%;
            border-radius: 10px;
            animation: popIn 0.5s ease;
        }

        @keyframes popIn {
            0% { transform: scale(0); }
            80% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="400"></canvas>
        
        <div id="ui-layer">
            <div id="start-screen">
                <h1>LOVE FLIGHT</h1>
                <p>방향키 [↑] [↓] 로 장애물을 피하세요</p>
                <button class="btn" onclick="startGame()">MISSION START</button>
            </div>
            
            <div id="game-over-screen" class="hidden">
                <h1 style="color: #ff4757;">CRASHED!</h1>
                <p><br>다시 도전할까요?</p>
                <button class="btn" onclick="startGame()">TRY AGAIN</button>
            </div>

            <div id="clear-screen" class="hidden">
                <div id="letter-box">
                    <h2 style="color:#ff69b4; margin-top:0;"></h2>
                    <p style="font-size: 20px; color: #444; line-height: 1.6;">

                    </p>
                    <button class="btn" style="font-size:18px; padding:10px 20px;" onclick="location.reload()">처음으로</button>
                </div>
            </div>
        </div>
    </div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    // ==========================================
    // 1. 도트 데이터 (플레이어 캐릭터 수정됨)
    // ==========================================
    
    // 플레이어: 분홍색 캐릭터 (12x12)
    // 0: 투명, 1: 연분홍, 2: 진분홍 (코, 배), 3: 갈색 (외곽선)
    const playerSprite = [
        "000333333000",
        "003111111300",
        "031311113130",
        "311111111113",
        "311311113113",
        "311112211113",
        "311121121113",
        "031122221130",
        "031111111130",
        "003121121300",
        "003212212300",
        "000333333000"
    ];

    const wallTop = [
        "111111", "111111", "011110", "001100", "001100", "001100", "000100"
    ];
    const wallBottom = [
        "000100", "001100", "001100", "001100", "011110", "111111", "111111"
    ];
    const block = [
        "00111100", "01111110", "11000011", "11000011", "11000011", "01111110", "00111100"
    ];

    // ==========================================
    // 2. 게임 변수
    // ==========================================
    let animationId;
    let isGaming = false;
    let score = 0;
    let gameSpeed = 5;
    let spawnRate = 90;
    let frames = 0;

    const keys = { ArrowUp: false, ArrowDown: false };
    const CLEAR_SCORE = 1500;

    // ==========================================
    // 3. 클래스 정의 (drawSprite 함수 수정됨)
    // ==========================================

    // 픽셀 그리기 함수 - 색상표 지원
    function drawSprite(ctx, sprite, x, y, size, colorMap) {
        for (let r = 0; r < sprite.length; r++) {
            for (let c = 0; c < sprite[r].length; c++) {
                const pixel = sprite[r][c];
                if (pixel !== '0' && colorMap[pixel]) {
                    ctx.fillStyle = colorMap[pixel];
                    ctx.fillRect(x + c * size, y + r * size, size, size);
                }
            }
        }
    }

    class Player {
        constructor() {
            this.pixelSize = 4;
            this.w = 12 * this.pixelSize;
            this.h = 12 * this.pixelSize;
            this.x = 50;
            this.y = 200;
            this.speed = 6;
            // 플레이어 색상표 정의
            this.colorMap = {
                '1': '#ffb6c1', // 연분홍
                '2': '#ff69b4', // 진분홍
                '3': '#8b4513'  // 갈색 (외곽선)
            };
            this.shadowColorMap = {
                '1': 'rgba(0,0,0,0.5)', '2': 'rgba(0,0,0,0.5)', '3': 'rgba(0,0,0,0.5)'
            };
        }

        update() {
            if (keys.ArrowUp) this.y -= this.speed;
            if (keys.ArrowDown) this.y += this.speed;

            if (this.y < 0) this.y = 0;
            if (this.y + this.h > canvas.height) this.y = canvas.height - this.h;

            this.draw();
        }

        draw() {
            // 그림자
            drawSprite(ctx, playerSprite, this.x + 4, this.y + 4, this.pixelSize, this.shadowColorMap);
            // 본체
            drawSprite(ctx, playerSprite, this.x, this.y, this.pixelSize, this.colorMap);
        }
    }

    class Obstacle {
        constructor() {
            this.x = canvas.width;
            this.size = 5;
            this.markedForDeletion = false;

            const type = Math.random();
            
            if (type < 0.33) {
                this.sprite = wallBottom;
                this.w = 6 * this.size;
                this.h = 7 * this.size;
                this.renderH = Math.random() * 50 + 50; 
                this.y = canvas.height - this.renderH;
                this.color = '#ff4757';
                this.mode = 'bottom';
            } else if (type < 0.66) {
                this.sprite = wallTop;
                this.w = 6 * this.size;
                this.renderH = Math.random() * 50 + 50;
                this.y = 0;
                this.color = '#7bed9f';
                this.mode = 'top';
            } else {
                this.sprite = block;
                this.w = 8 * this.size;
                this.h = 7 * this.size;
                this.y = Math.random() * (canvas.height - 100) + 50;
                this.renderH = this.h;
                this.color = '#ffa502';
                this.mode = 'mid';
            }
            // 장애물용 단순 색상표
            this.colorMap = { '1': this.color };
        }

        update() {
            this.x -= gameSpeed;
            if (this.x + this.w < 0) this.markedForDeletion = true;
            this.draw();
        }

        draw() {
            if (this.mode === 'bottom') {
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x + this.size, this.y + 20, this.w - this.size*2, canvas.height); 
                drawSprite(ctx, this.sprite, this.x, this.y, this.size, this.colorMap);
            } else if (this.mode === 'top') {
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x + this.size, 0, this.w - this.size*2, this.renderH);
                drawSprite(ctx, this.sprite, this.x, this.renderH - 10, this.size, this.colorMap);
            } else {
                drawSprite(ctx, this.sprite, this.x, this.y, this.size, this.colorMap);
            }
        }
    }

    class Star {
        constructor() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            this.size = Math.random() * 2;
            this.speed = Math.random() * 0.5 + 0.1;
        }
        update() {
            this.x -= this.speed * (gameSpeed * 0.5);
            if (this.x < 0) {
                this.x = canvas.width;
                this.y = Math.random() * canvas.height;
            }
            ctx.fillStyle = 'white';
            ctx.fillRect(this.x, this.y, this.size, this.size);
        }
    }

    // ==========================================
    // 4. 메인 로직
    // ==========================================
    
    let player;
    let obstacles = [];
    let stars = [];

    function init() {
        player = new Player();
        obstacles = [];
        score = 0;
        frames = 0;
        gameSpeed = 5;
        spawnRate = 90;
        
        stars = [];
        for(let i=0; i<50; i++) stars.push(new Star());
    }

    function startGame() {
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('game-over-screen').classList.add('hidden');
        document.getElementById('clear-screen').classList.add('hidden');
        isGaming = true;
        init();
        animate();
    }

    function animate() {
        if (!isGaming) return;
        
        animationId = requestAnimationFrame(animate);
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        stars.forEach(star => star.update());

        frames++;
        if (score > 0 && score % 500 === 0 && frames % 60 === 0) {
            gameSpeed += 0.5;
            spawnRate = Math.max(40, spawnRate - 5);
        }

        if (frames % spawnRate === 0) {
            obstacles.push(new Obstacle());
            frames += Math.floor(Math.random() * 20) - 10; 
        }

        obstacles.forEach((o, index) => {
            o.update();
            const pBox = { x: player.x+5, y: player.y+5, w: player.w-10, h: player.h-10 };
            let oBox = { x: o.x+5, y: o.y+5, w: o.w-10, h: o.renderH || o.h };
            if (o.mode === 'bottom') oBox.h = 1000;
            if (o.mode === 'top') { oBox.y = 0; oBox.h = o.renderH; }

            if (pBox.x < oBox.x + oBox.w && pBox.x + pBox.w > oBox.x &&
                pBox.y < oBox.y + oBox.h && pBox.y + pBox.h > oBox.y) {
                gameOver();
            }
            if (o.markedForDeletion) {
                obstacles.splice(index, 1);
                score += 10;
            }
        });

        player.update();

        ctx.fillStyle = 'white';
        ctx.font = '24px VT323';
        ctx.fillText(`SCORE: ${score}`, 20, 40);
        ctx.fillStyle = '#aaa';
        ctx.font = '16px VT323';
        ctx.fillText(`SPEED: ${gameSpeed.toFixed(1)}`, 20, 65);

        if (score >= CLEAR_SCORE) gameClear();
    }

    function gameOver() {
        isGaming = false;
        cancelAnimationFrame(animationId);
        document.getElementById('game-over-screen').classList.remove('hidden');
    }

    function gameClear() {
        isGaming = false;
        cancelAnimationFrame(animationId);
        document.getElementById('clear-screen').classList.remove('hidden');
    }

    window.addEventListener('keydown', e => {
        if (e.code === 'ArrowUp') keys.ArrowUp = true;
        if (e.code === 'ArrowDown') keys.ArrowDown = true;
        if(['ArrowUp', 'ArrowDown', 'Space'].indexOf(e.code) > -1) e.preventDefault();
    });

    window.addEventListener('keyup', e => {
        if (e.code === 'ArrowUp') keys.ArrowUp = false;
        if (e.code === 'ArrowDown') keys.ArrowDown = false;
    });
</script>
</body>
</html>
