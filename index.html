<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>서비스 이용약관 동의</title>
    <style>
        body {
            font-family: 'Pretendard', sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        #game-container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 400px;
            text-align: center;
            position: relative;
            transition: all 0.3s;
        }
        h2 { color: #333; font-size: 1.2rem; }
        .progress { margin-bottom: 20px; color: #666; font-size: 0.9rem; }
        .terms-box {
            height: 100px;
            overflow-y: scroll;
            border: 1px solid #ddd;
            padding: 10px;
            font-size: 0.8rem;
            text-align: left;
            margin-bottom: 20px;
            background: #fafafa;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            position: relative;
            height: 50px;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.1s;
        }
        .btn-agree { background-color: #4CAF50; color: white; }
        .btn-decline { background-color: #f44336; color: white; }
        
        /* Ending Style */
        #letter {
            display: none;
            line-height: 1.6;
            color: #444;
            white-space: pre-wrap;
        }
        .heart { color: #f44336; font-size: 1.5rem; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="game-ui">
        <h2>서비스 이용약관 동의 (필수)</h2>
        <div class="progress">단계: <span id="level">1</span> / 10</div>
        <div class="terms-box" id="terms">
            제 1조: 본 게임의 제작자는 당신을 매우 사랑하며... (스크롤을 내려서 동의를 완료하십시오)
        </div>
        <div class="btn-group" id="btn-container">
            <button class="btn-agree" id="agreeBtn">동의한다</button>
            <button class="btn-decline" id="declineBtn">동의안함</button>
        </div>
    </div>

    <div id="letter">
        <p id="letter-content">
            고생했어! 끈기 있게 동의해줘서 고마워.
        </p>
        <div class="heart">♥♥ patches and hugs ♥♥</div>
    </div>
</div>

<script>
    /* Game Logic */
    let currentLevel = 1;
    const maxLevel = 10;
    const agreeBtn = document.getElementById('agreeBtn');
    const declineBtn = document.getElementById('declineBtn');
    const levelDisplay = document.getElementById('level');
    const gameUI = document.getElementById('game-ui');
    const letter = document.getElementById('letter');
    const container = document.getElementById('game-container');

    // Button Click Event
    agreeBtn.onclick = () => {
        if (currentLevel < maxLevel) {
            nextLevel();
        } else {
            showEnding();
        }
    };

    declineBtn.onclick = () => {
        alert("동의하지 않으면 다음 단계로 넘어갈 수 없습니다.");
        resetButtonEffect();
    };

    function nextLevel() {
        currentLevel++;
        levelDisplay.innerText = currentLevel;
        applyLevelEffect();
    }

    function applyLevelEffect() {
        resetButtonEffect();
        
        switch(currentLevel) {
            case 2: // 위치 바꿈
                document.getElementById('btn-container').style.flexDirection = 'row-reverse';
                break;
            case 3: // 작아짐
                agreeBtn.style.transform = 'scale(0.5)';
                break;
            case 4: // 투명해짐
                agreeBtn.style.opacity = '0.2';
                break;
            case 5: // 움직이는 버튼
                agreeBtn.style.position = 'absolute';
                moveButton();
                agreeBtn.onmouseover = moveButton;
                break;
            case 6: // 회전
                container.style.transform = 'rotate(10deg)';
                break;
            case 7: // 버튼 텍스트 속임수
                agreeBtn.innerText = '동의안함';
                declineBtn.innerText = '동의한다';
                // 텍스트는 바뀌었지만 기능은 그대로 유지하여 헷갈리게 함
                break;
            case 8: // 무작위 위치로 도망치기
                agreeBtn.onmouseover = teleportButton;
                break;
            case 9: // 점점 작아지는 컨테이너
                container.style.transform = 'scale(0.7) rotate(-5deg)';
                break;
            case 10: // 마지막 혼란 (전부 섞기)
                agreeBtn.innerText = '???';
                setInterval(teleportButton, 500);
                break;
        }
    }

    function moveButton() {
        const x = Math.random() * 100 - 50;
        const y = Math.random() * 50 - 25;
        agreeBtn.style.transform = `translate(${x}px, ${y}px)`;
    }

    function teleportButton() {
        const x = Math.random() * (window.innerWidth - 100);
        const y = Math.random() * (window.innerHeight - 50);
        agreeBtn.style.position = 'fixed';
        agreeBtn.style.left = x + 'px';
        agreeBtn.style.top = y + 'px';
    }

    function resetButtonEffect() {
        agreeBtn.style = "";
        agreeBtn.onmouseover = null;
        agreeBtn.innerText = "동의한다";
        declineBtn.innerText = "동의안함";
        document.getElementById('btn-container').style.flexDirection = 'row';
    }

    function showEnding() {
        gameUI.style.display = 'none';
        letter.style.display = 'block';
        container.style.transform = 'scale(1.1)';
        container.style.borderColor = '#f44336';
        container.style.borderWidth = '2px';
        container.style.borderStyle = 'solid';
    }
</script>

</body>
</html>
