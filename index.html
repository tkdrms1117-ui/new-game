<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Survival</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #1a1a1a;
            font-family: 'VT323', monospace;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            border: 4px solid #444;
            background-color: #000;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.2);
            width: 800px;
            height: 400px;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
            z-index: 10;
        }

        .hidden { display: none !important; }

        h1 { 
            font-size: 60px; 
            margin: 0 0 20px 0; 
            color: #00d2d3; 
            text-shadow: 4px 4px 0 #333; 
            letter-spacing: 5px;
        }
        
        p { font-size: 24px; color: #ccc; margin-bottom: 30px; }

        .btn {
            pointer-events: auto;
            background: #00d2d3;
            border: 2px solid white;
            color: #000;
            padding: 15px 30px;
            font-family: 'VT323', monospace;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .btn:hover { background-color: #00a8a9; color: white; }
        .btn:active { transform: scale(0.95); }

        /* Report Box Style */
        #report-box {
            background: rgba(0, 0, 0, 0.9);
            color: #00d2d3;
            border: 2px solid #00d2d3;
            padding: 30px;
            max-width: 80%;
            box-shadow: 0 0 20px rgba(0, 210, 211, 0.3);
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="400"></canvas>
        
        <div id="ui-layer">
            <!-- Start Screen -->
            <div id="start-screen">
                <h1>SPACE SURVIVAL</h1>
                <p>USE ARROW KEYS [↑] [↓] [←] [→] TO SURVIVE</p>
                <button class="btn" onclick="startGame()">LAUNCH</button>
            </div>
            
            <!-- Game Over Screen -->
            <div id="game-over-screen" class="hidden">
                <h1 style="color: #ff4757;">CRITICAL FAILURE</h1>
                <p>COLLISION DETECTED</p>
                <button class="btn" onclick="startGame()">RETRY MISSION</button>
            </div>

            <!-- Clear Screen -->
            <div id="clear-screen" class="hidden">
                <div id="report-box">
                    <h2 style="margin-top:0;">MISSION ACCOMPLISHED</h2>
                    <p style="font-size: 20px; color: #fff; line-height: 1.6;">
                        You have successfully navigated through the asteroid belt.<br>
                        Orbit stabilized.<br>
                        System integrity: 100%<br><br>
                        Waiting for next command...
                    </p>
                    <button class="btn" style="font-size:18px; padding:10px 20px;" onclick="location.reload()">RETURN TO BASE</button>
                </div>
            </div>
        </div>
    </div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    // ==========================================
    // 1. Sprite Data (16x16 High Detail)
    // ==========================================
    
    // 0: Trans, 1: Light Pink, 2: Dark Pink, 3: Brown(Outline), 4: White(Highlight), 5: Red(Heart/Cheek)
    const playerSprite = [
        "0000003333330000",
        "0000331111113300",
        "0003111111111130",
        "0031111111111113",
        "0311111111111113",
        "0311331111331113", // Eyes
        "3111331111331113",
        "3111111221111113", // Nose
        "3115111221115113", // Cheeks
        "3111111111111113",
        "0311111111111130",
        "0321111111111230",
        "0032211111122300",
        "0003322222233000",
        "0000033333300000",
        "0000000000000000"
    ];

    // Meteor (Asteroid) - Irregular Shape
    // 1: Gray, 2: Dark Gray, 3: Black outline
    const meteorSprite = [
        "000033330000",
        "003311113300",
        "031112211130",
        "311222221113",
        "312211112213",
        "312112211213",
        "311222221113",
        "311111111113",
        "031112211130",
        "003311113300",
        "000033330000"
    ];

    // Space Debris (Satellite part)
    // 1: Blue, 2: Metal/Gray, 3: Outline
    const debrisSprite = [
        "000000330000",
        "000003113000",
        "000031111300",
        "000322222230",
        "003222222223",
        "0311112211113",
        "31111122111113",
        "0311112211113",
        "003222222223",
        "000322222230",
        "000031111300",
        "000003113000"
    ];

    // Small Rock
    const rockSprite = [
        "003330",
        "031113",
        "312213",
        "311123",
        "033330"
    ];

    // ==========================================
    // 2. Game Variables
    // ==========================================
    let animationId;
    let isGaming = false;
    let score = 0;
    let gameSpeed = 5;
    let spawnRate = 60; // Spawn faster start
    let frames = 0;

    const keys = { 
        ArrowUp: false, 
        ArrowDown: false, 
        ArrowLeft: false, 
        ArrowRight: false 
    };
    
    // Clear Score
    const CLEAR_SCORE = 3000; 

    // ==========================================
    // 3. Classes
    // ==========================================

    // Pixel Draw Function
    function drawSprite(ctx, sprite, x, y, size, colorMap) {
        for (let r = 0; r < sprite.length; r++) {
            for (let c = 0; c < sprite[r].length; c++) {
                const pixel = sprite[r][c];
                if (pixel !== '0' && colorMap[pixel]) {
                    ctx.fillStyle = colorMap[pixel];
                    ctx.fillRect(x + c * size, y + r * size, size, size);
                }
            }
        }
    }

    class Player {
        constructor() {
            this.pixelSize = 3; // Make pixels a bit smaller for higher detail feel
            this.w = 16 * this.pixelSize;
            this.h = 16 * this.pixelSize;
            this.x = 50;
            this.y = 200;
            this.speedX = 6;
            this.speedY = 6;
            
            // Player Color Map (Pink Bear)
            this.colorMap = {
                '1': '#ffb6c1', // Light Pink
                '2': '#ff69b4', // Dark Pink
                '3': '#5d4037', // Brown Outline
                '4': '#ffffff', // White
                '5': '#ff4757'  // Red Cheek
            };
        }

        update() {
            // Movement Logic
            if (keys.ArrowUp) this.y -= this.speedY;
            if (keys.ArrowDown) this.y += this.speedY;
            if (keys.ArrowLeft) this.x -= this.speedX;
            if (keys.ArrowRight) this.x += this.speedX;

            // Boundary Check
            if (this.y < 0) this.y = 0;
            if (this.y + this.h > canvas.height) this.y = canvas.height - this.h;
            if (this.x < 0) this.x = 0;
            if (this.x + this.w > canvas.width) this.x = canvas.width - this.w;

            this.draw();
        }

        draw() {
            // Engine Trail (Simple effect)
            ctx.fillStyle = `rgba(0, 255, 255, ${Math.random()})`;
            ctx.fillRect(this.x - 10, this.y + this.h/2 - 2, 10, 4);

            drawSprite(ctx, playerSprite, this.x, this.y, this.pixelSize, this.colorMap);
        }
    }

    class Obstacle {
        constructor() {
            this.x = canvas.width;
            this.size = 3 + Math.random() * 2; // Random size
            this.markedForDeletion = false;
            
            // Randomly choose obstacle type
            const type = Math.random();
            
            if (type < 0.5) {
                // Meteor
                this.sprite = meteorSprite;
                this.colorMap = {
                    '1': '#95a5a6', // Gray
                    '2': '#7f8c8d', // Dark Gray
                    '3': '#2c3e50'  // Dark Blue/Black
                };
                this.w = 12 * this.size;
                this.h = 11 * this.size;
            } else if (type < 0.8) {
                // Debris
                this.sprite = debrisSprite;
                this.colorMap = {
                    '1': '#3498db', // Blue
                    '2': '#bdc3c7', // Silver
                    '3': '#2c3e50'  // Dark
                };
                this.w = 12 * this.size;
                this.h = 12 * this.size;
            } else {
                // Small Rock (Fast)
                this.sprite = rockSprite;
                this.colorMap = {
                    '1': '#e67e22', // Orangeish
                    '2': '#d35400',
                    '3': '#8e44ad'
                };
                this.w = 6 * this.size;
                this.h = 5 * this.size;
            }

            // Spawn Y position
            this.y = Math.random() * (canvas.height - this.h);
            
            // Individual speed variance
            this.speedOffset = Math.random() * 3; 
        }

        update() {
            this.x -= (gameSpeed + this.speedOffset);
            
            if (this.x + this.w < 0) this.markedForDeletion = true;
            this.draw();
        }

        draw() {
            drawSprite(ctx, this.sprite, this.x, this.y, this.size, this.colorMap);
        }
    }

    class Star {
        constructor() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            this.size = Math.random() * 2;
            this.speed = Math.random() * 0.5 + 0.1;
        }
        update() {
            this.x -= this.speed * (gameSpeed * 0.2); // Background moves slower
            if (this.x < 0) {
                this.x = canvas.width;
                this.y = Math.random() * canvas.height;
            }
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.fillRect(this.x, this.y, this.size, this.size);
        }
    }

    // ==========================================
    // 4. Main Game Logic
    // ==========================================
    
    let player;
    let obstacles = [];
    let stars = [];

    function init() {
        player = new Player();
        obstacles = [];
        score = 0;
        frames = 0;
        gameSpeed = 6; // Initial Speed increased
        spawnRate = 50; 
        
        stars = [];
        for(let i=0; i<80; i++) stars.push(new Star());
    }

    function startGame() {
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('game-over-screen').classList.add('hidden');
        document.getElementById('clear-screen').classList.add('hidden');
        isGaming = true;
        init();
        animate();
    }

    function animate() {
        if (!isGaming) return;
        
        animationId = requestAnimationFrame(animate);
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 1. Background
        stars.forEach(star => star.update());

        frames++;
        
        // Difficulty Logic: Faster increase
        // Increase speed every 200 points (was 500)
        if (score > 0 && score % 200 === 0 && frames % 10 === 0) {
            gameSpeed += 0.8; // Increase amount up
            spawnRate = Math.max(15, spawnRate - 2); // Cap at 15 frames
        }

        // Spawn Obstacles
        if (frames % spawnRate === 0) {
            obstacles.push(new Obstacle());
            // Add randomness to spawn timing
            frames += Math.floor(Math.random() * 10) - 5; 
        }

        // Obstacle Logic
        obstacles.forEach((o, index) => {
            o.update();
            
            // Collision Detection (Box)
            // Shrink hitbox slightly for fairness
            const pBox = { 
                x: player.x + 8, 
                y: player.y + 8, 
                w: player.w - 16, 
                h: player.h - 16 
            };
            const oBox = { 
                x: o.x + 4, 
                y: o.y + 4, 
                w: o.w - 8, 
                h: o.h - 8 
            };

            if (
                pBox.x < oBox.x + oBox.w &&
                pBox.x + pBox.w > oBox.x &&
                pBox.y < oBox.y + oBox.h &&
                pBox.y + pBox.h > oBox.y
            ) {
                gameOver();
            }

            // Remove off-screen
            if (o.markedForDeletion) {
                obstacles.splice(index, 1);
                score += 10;
            }
        });

        // Player Logic
        player.update();

        // UI
        ctx.fillStyle = '#00d2d3';
        ctx.font = '24px VT323';
        ctx.fillText(`SCORE: ${score}`, 20, 40);
        
        // Speed Meter
        ctx.fillStyle = '#ff6b6b';
        ctx.font = '20px VT323';
        ctx.fillText(`VELOCITY: ${(gameSpeed * 10).toFixed(0)} km/s`, 20, 70);

        // Clear Check
        if (score >= CLEAR_SCORE) {
            gameClear();
        }
    }

    function gameOver() {
        isGaming = false;
        cancelAnimationFrame(animationId);
        document.getElementById('game-over-screen').classList.remove('hidden');
    }

    function gameClear() {
        isGaming = false;
        cancelAnimationFrame(animationId);
        document.getElementById('clear-screen').classList.remove('hidden');
    }

    // Input Handling
    window.addEventListener('keydown', e => {
        if (keys.hasOwnProperty(e.code)) {
            keys[e.code] = true;
            e.preventDefault();
        }
    });

    window.addEventListener('keyup', e => {
        if (keys.hasOwnProperty(e.code)) {
            keys[e.code] = false;
        }
    });

</script>
</body>
</html>
