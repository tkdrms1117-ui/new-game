<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Connection Game</title>
    <style>
        @font-face {
            font-family: 'PixelFont';
            src: url('https://fonts.cdnfonts.com/s/193/PressStart2P-Regular.ttf') format('truetype');
        }
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f0f0;
            font-family: 'PixelFont', sans-serif;
        }
        #game-container {
            position: relative;
            width: 800px;
            height: 400px;
            overflow: hidden;
            background-color: #a0d8ef; /* 하늘색 배경 */
        }
        canvas {
            display: block;
            /* 픽셀 아트 선명하게 */
            image-rendering: optimizeSpeed;
            image-rendering: -moz-crisp-edges;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: optimize-contrast;
            image-rendering: pixelated;
            -ms-interpolation-mode: nearest-neighbor;
        }
        #game-over-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #333;
            display: none; /* 처음에는 숨김 */
            z-index: 10;
        }
        #game-over-screen h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }
        #game-over-screen p {
            font-size: 14px;
            margin-bottom: 20px;
        }
        .score-board {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            background-color: rgba(255, 255, 255, 0.8);
            padding: 10px;
            border-radius: 10px;
        }
        .score-board img {
            width: 40px;
            height: 40px;
            image-rendering: pixelated;
        }
        .score-details {
            text-align: left;
        }
        .score-details div {
            font-size: 12px;
        }
        #restart-button {
            padding: 10px 20px;
            font-size: 14px;
            font-family: 'PixelFont', sans-serif;
            cursor: pointer;
            background-color: #f0f0f0;
            border: 2px solid #333;
            border-radius: 5px;
            box-shadow: 2px 2px 0 #333;
        }
        #restart-button:active {
            box-shadow: none;
            transform: translate(2px, 2px);
        }
        #score {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 16px;
            color: #333;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="400"></canvas>
        <div id="score">SCORE: 0<br>HI: 0</div>
        <div id="game-over-screen">
            <h1>GAME OVER</h1>
            <p>YOUR LOVE CONNECTION WAS INTERRPETED!</p>
            <div class="score-board">
                <img src="assets/bear_dead.png" alt="Sad Bear">
                <div class="score-details">
                    <div>SCORE <span id="final-score">0</span></div>
                    <div>HI <span id="best-score">0</span></div>
                </div>
            </div>
            <button id="restart-button">TRY AGAIN (FOR HER LOVE)</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const gameOverScreen = document.getElementById('game-over-screen');
        const finalScoreElement = document.getElementById('final-score');
        const bestScoreElement = document.getElementById('best-score');
        const restartButton = document.getElementById('restart-button');

        let gameSpeed = 5;
        let score = 0;
        let highScore = localStorage.getItem('highScore') || 0;
        let isGameOver = false;
        let animationId;
        bestScoreElement.innerText = highScore.toString().padStart(5, '0');

        // --- 이미지 로드 ---
        const images = {};
        const loadImages = (callback) => {
            const imageSources = {
                bearRun1: 'assets/bear_run1.png',
                bearRun2: 'assets/bear_run2.png',
                bearJump: 'assets/bear_jump.png',
                cactus1: 'assets/cactus1.png',
                cactus2: 'assets/cactus2.png',
                cactus3: 'assets/cactus3.png',
                bird1: 'assets/bird1.png',
                bird2: 'assets/bird2.png',
                ground: 'assets/ground.png',
                cloud: 'assets/cloud.png',
                sun: 'assets/sun.png'
            };
            let loadedCount = 0;
            const totalImages = Object.keys(imageSources).length;

            for (const key in imageSources) {
                const img = new Image();
                img.onload = () => {
                    loadedCount++;
                    if (loadedCount === totalImages) callback();
                };
                img.src = imageSources[key];
                images[key] = img;
            }
        };

        // --- 게임 객체 ---
        const GROUND_HEIGHT = 50;
        const player = {
            x: 50,
            y: canvas.height - GROUND_HEIGHT,
            width: 50, // 실제 이미지 크기에 맞게 조절
            height: 60, // 실제 이미지 크기에 맞게 조절
            vy: 0,
            jumpPower: -13,
            gravity: 0.6,
            onGround: true,
            frame: 0,
            frameTimer: 0,
            draw() {
                let img;
                if (!this.onGround) {
                    img = images.bearJump;
                } else {
                    this.frameTimer++;
                    if (this.frameTimer % 10 === 0) this.frame = (this.frame + 1) % 2;
                    img = this.frame === 0 ? images.bearRun1 : images.bearRun2;
                }
                // 이미지 기준점을 하단 중앙으로 맞춰 그리기
                ctx.drawImage(img, this.x, this.y - img.height + 5, img.width, img.height);
                // 충돌 박스 확인용 (주석 처리)
                // ctx.strokeStyle = 'red'; ctx.strokeRect(this.x, this.y - this.height + 5, this.width, this.height);
            },
            jump() {
                if (this.onGround) {
                    this.vy = this.jumpPower;
                    this.onGround = false;
                }
            },
            update() {
                this.vy += this.gravity;
                this.y += this.vy;
                if (this.y > canvas.height - GROUND_HEIGHT) {
                    this.y = canvas.height - GROUND_HEIGHT;
                    this.vy = 0;
                    this.onGround = true;
                }
            }
        };

        let obstacles = [];
        const obstacleTypes = [
            { type: 'cactus', imgs: ['cactus1', 'cactus2', 'cactus3'], yOffset: 0 },
            { type: 'bird', imgs: ['bird1', 'bird2'], yOffset: [40, 80, 120], speed: 2 }
        ];

        function spawnObstacle() {
            if (isGameOver) return;
            const type = obstacleTypes[Math.floor(Math.random() * obstacleTypes.length)];
            const imgKey = type.imgs[Math.floor(Math.random() * type.imgs.length)];
            const img = images[imgKey];
            let y = canvas.height - GROUND_HEIGHT - img.height + type.yOffset;
            let speed = gameSpeed;

            if (type.type === 'bird') {
                 y = canvas.height - GROUND_HEIGHT - img.height - type.yOffset[Math.floor(Math.random() * type.yOffset.length)];
                 speed += type.speed;
            }

            obstacles.push({
                x: canvas.width,
                y: y,
                width: img.width,
                height: img.height,
                img: img,
                type: type.type,
                frame: 0,
                frameTimer: 0,
                speed: speed
            });

            const nextSpawnTime = Math.random() * 1500 + 800; // 0.8 ~ 2.3초 랜덤 스폰
            setTimeout(spawnObstacle, nextSpawnTime);
        }

        let clouds = [];
        function spawnCloud() {
            if(isGameOver) return;
            const img = images.cloud;
            clouds.push({
                x: canvas.width,
                y: Math.random() * (canvas.height / 2),
                width: img.width,
                height: img.height,
                img: img,
                speed: gameSpeed * 0.5
            });
            setTimeout(spawnCloud, Math.random() * 3000 + 2000);
        }

        let groundX = 0;
        function drawBackground() {
            // 하늘 (CSS 배경색으로 처리됨)
            // 해
            ctx.drawImage(images.sun, canvas.width - 100, 20);
            // 구름
            clouds.forEach(cloud => {
                ctx.drawImage(cloud.img, cloud.x, cloud.y);
                if(!isGameOver) cloud.x -= cloud.speed;
            });
            clouds = clouds.filter(cloud => cloud.x + cloud.width > 0);
            // 땅
            const groundImg = images.ground;
            for (let i = 0; i < canvas.width / groundImg.width + 2; i++) {
                ctx.drawImage(groundImg, groundX + i * groundImg.width, canvas.height - GROUND_HEIGHT);
            }
            if (!isGameOver) {
                groundX -= gameSpeed;
                if (groundX <= -groundImg.width) groundX = 0;
            }
        }

        function updateGame() {
            if (isGameOver) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawBackground();
            player.update();
            player.draw();

            obstacles.forEach((obstacle, index) => {
                obstacle.x -= obstacle.speed;
                if (obstacle.type === 'bird') {
                    obstacle.frameTimer++;
                    if(obstacle.frameTimer % 10 === 0) obstacle.frame = (obstacle.frame + 1) % 2;
                    obstacle.img = images[obstacleTypes[1].imgs[obstacle.frame]];
                }
                ctx.drawImage(obstacle.img, obstacle.x, obstacle.y);

                // 충돌 감지 (AABB)
                const playerHitbox = { x: player.x + 10, y: player.y - player.height + 10, width: player.width - 20, height: player.height - 10 };
                const obstacleHitbox = { x: obstacle.x + 5, y: obstacle.y + 5, width: obstacle.width - 10, height: obstacle.height - 10 };
                // ctx.strokeStyle = 'blue'; ctx.strokeRect(playerHitbox.x, playerHitbox.y, playerHitbox.width, playerHitbox.height);
                // ctx.strokeStyle = 'red'; ctx.strokeRect(obstacleHitbox.x, obstacleHitbox.y, obstacleHitbox.width, obstacleHitbox.height);

                if (
                    playerHitbox.x < obstacleHitbox.x + obstacleHitbox.width &&
                    playerHitbox.x + playerHitbox.width > obstacleHitbox.x &&
                    playerHitbox.y < obstacleHitbox.y + obstacleHitbox.height &&
                    playerHitbox.y + playerHitbox.height > obstacleHitbox.y
                ) {
                    gameOver();
                }

                if (obstacle.x + obstacle.width < 0) {
                    obstacles.splice(index, 1);
                    score++;
                }
            });

            score++;
            if(score % 500 === 0) gameSpeed += 0.5; // 점수에 따라 속도 증가
            updateScoreDisplay();

            animationId = requestAnimationFrame(updateGame);
        }

        function updateScoreDisplay() {
            const scoreStr = Math.floor(score / 10).toString().padStart(5, '0');
            const highScoreStr = highScore.toString().padStart(5, '0');
            scoreElement.innerHTML = `SCORE: ${scoreStr}<br>HI: ${highScoreStr}`;
        }

        function gameOver() {
            isGameOver = true;
            cancelAnimationFrame(animationId);
            const finalScore = Math.floor(score / 10);
            if (finalScore > highScore) {
                highScore = finalScore;
                localStorage.setItem('highScore', highScore);
            }
            finalScoreElement.innerText = finalScore.toString().padStart(5, '0');
            bestScoreElement.innerText = highScore.toString().padStart(5, '0');
            gameOverScreen.style.display = 'block';
        }

        function resetGame() {
            isGameOver = false;
            score = 0;
            gameSpeed = 5;
            obstacles = [];
            clouds = [];
            player.y = canvas.height - GROUND_HEIGHT;
            player.vy = 0;
            gameOverScreen.style.display = 'none';
            spawnObstacle();
            spawnCloud();
            updateGame();
        }

        // --- 이벤트 리스너 ---
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                if (isGameOver) {
                    resetGame();
                } else {
                    player.jump();
                }
            }
        });
        canvas.addEventListener('touchstart', (e) => {
             if (isGameOver) {
                resetGame();
            } else {
                player.jump();
            }
            e.preventDefault();
        }, { passive: false });

        restartButton.addEventListener('click', resetGame);

        // --- 게임 시작 ---
        // 이미지 로드 후 게임 시작
        loadImages(() => {
            spawnObstacle();
            spawnCloud();
            updateGame();
        });
        // 이미지 파일이 없을 경우를 대비해 임시 실행 (이미지 파일 준비 후 제거)
        // spawnObstacle(); spawnCloud(); updateGame();

    </script>
</body>
</html>
